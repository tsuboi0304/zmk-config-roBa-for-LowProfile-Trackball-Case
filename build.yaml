# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
 - board: seeeduino_xiao_ble
   shield: roBa_L
 - board: seeeduino_xiao_ble
   shield: roBa_L
   # ロータリーエンコーダのチャタリング調査用: USB CDC ACMでログを出力するビルド。
   # 左手をPCにUSBケーブルで接続し、シリアルターミナル(115200bps)で
   # ec11ドライバのDelta(+1/-1)ログを見ながらエンコーダを回すと、
   # 取りこぼしや逆回転の誤検出が起きた瞬間を確認できる。
   # seeeduino_xiao_ble のデフォルト設定はSERIAL/CONSOLE類を無効化しているため、
   # USBログを有効にするにはこれらも明示的に再度有効化する必要がある
   # (CDC ACM用のdevicetreeノードは roBa_L.overlay 側で追加済み)。
   cmake-args: >-
     -DCONFIG_ZMK_USB_LOGGING=y
     -DCONFIG_SERIAL=y -DCONFIG_CONSOLE=y -DCONFIG_UART_CONSOLE=y -DCONFIG_UART_INTERRUPT_DRIVEN=y
     -DCONFIG_SENSOR_LOG_LEVEL_DBG=y
   artifact-name: roBa_L_with_logging
 - board: seeeduino_xiao_ble
   shield: settings_reset
